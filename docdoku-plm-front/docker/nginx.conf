# ============================================================
# 镜像内置 nginx 配置（供无 bind mount 的离线部署使用）
# 运行时配置由 docdoku-plm-docker/front/nginx.conf 通过 bind mount 覆盖。
# ============================================================
server {
    listen       80;
    server_name  localhost;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json
               text/javascript text/xml text/plain application/xml
               application/x-javascript image/svg+xml;
    gzip_vary on;

    charset utf-8;
    # 只列 nginx 默认不含的类型，避免 "duplicate MIME type text/html" warn
    charset_types text/css application/javascript application/json;

    # Docker 内部 DNS，运行时解析 upstream，避免启动时序问题
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量声明：upstream 暂不可达时 nginx 仍能启动
    set $backpy "back-py:8000";

    set $plm_port 8000;
    set $plm_ssl  false;
    if ($http_host !~ ":\d+") {
        set $plm_port 443;
        set $plm_ssl  true;
    }
    if ($http_x_forwarded_proto = "https") {
        set $plm_port 443;
        set $plm_ssl  true;
    }

    # auth / parts：需暴露 jwt 响应头
    location ~ ^/docdoku-plm-server-rest/api/(auth/|files/[^/]+/(parts|part-templates)|workspaces/[^/]+/(parts|part-templates)) {
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    # WebSocket 端点
    location /docdoku-plm-server-rest/ws {
        proxy_pass         http://$backpy/docdoku-plm-server-rest/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
    }

    # 所有其余 API — 全部转发到 FastAPI back-py
    location /docdoku-plm-server-rest/ {
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        gzip off;
        sub_filter_types application/json text/plain;
        sub_filter '"domain": "localhost"'   '"domain": "$host"';
        sub_filter '"wsDomain": "localhost"' '"wsDomain": "$host"';
        sub_filter '"port": 8000'            '"port": $plm_port';
        sub_filter '"ssl": false'            '"ssl": $plm_ssl';
        sub_filter_once off;
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.html$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
