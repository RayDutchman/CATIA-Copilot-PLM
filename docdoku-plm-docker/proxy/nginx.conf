server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl/cert.crt;
        ssl_certificate_key /etc/nginx/ssl/cert.key;

        server_name docdokuplm.local;
        client_max_body_size 1024M;

        # Docker 内部 DNS，延迟解析 upstream 避免启动时序问题
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
                set $front_upstream "front";
                add_header Last-Modified $date_gmt;
                add_header Cache-Control 'private no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                if_modified_since off;
                expires off;
                etag off;
                proxy_pass http://$front_upstream;
        }

        # API 走 front（front 的 80 端口已全量路由到 FastAPI back-py + 502 兜底）
        # 由 front 作为唯一路由权威，避免与 Port 80 规则不同步
        location /docdoku-plm-server-rest/api {
                set $front_upstream "front";
                proxy_pass http://$front_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                add_header Access-Control-Expose-Headers "jwt" always;
        }

        location /docdoku-plm-server-rest/ws {
                set $front_upstream "front";
                proxy_pass http://$front_upstream/docdoku-plm-server-rest/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host              $host;
                proxy_set_header X-Real-IP         $remote_addr;
                proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 7200s;
        }
}
