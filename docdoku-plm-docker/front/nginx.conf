server {
    listen       80;
    server_name  localhost;

    # Serve all text and JS files as UTF-8 so Chinese NLS translations
    # are decoded correctly by the browser and by RequireJS XHR requests.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    # -------------------------------------------------------------------------
    # 反向代理后端 REST API（含 WebSocket）
    #
    # 作用：浏览器无论从哪个入口访问前端，所有 API 请求都通过同一主机的 8000 端口
    # 发出，由 nginx 内部转发给 back 容器，无需向外暴露 8001。
    # -------------------------------------------------------------------------
    location /docdoku-plm-server-rest/ {
        proxy_pass         http://back:8080/docdoku-plm-server-rest/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WebSocket 升级支持（PLM 实时推送）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 允许大文件上传（CAD 文件可能较大）
        client_max_body_size 500m;
    }

    # -------------------------------------------------------------------------
    # 动态注入 webapp.properties.json 中的 domain
    #
    # front.json 里写的是 "localhost"，但 sub_filter 会在响应发出前把它替换为
    # 当前请求的 Host（即浏览器实际访问的主机名），确保 JS 构建的 API 地址与
    # 访问入口一致：
    #   手机访问 192.168.100.140:8000  →  domain: "192.168.100.140"
    #   Windows 访问 localhost:8000    →  domain: "localhost"
    #   公网访问 cwbtest.ddnsto.com    →  domain: "cwbtest.ddnsto.com"
    # -------------------------------------------------------------------------
    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        # 关闭 gzip 压缩，否则 sub_filter 无法替换压缩内容
        gzip off;
        # sub_filter 默认只处理 text/html，必须显式声明 json 类型
        sub_filter_types application/json text/plain;
        sub_filter '"domain": "localhost"'   '"domain": "$host"';
        sub_filter '"wsDomain": "localhost"' '"wsDomain": "$host"';
        sub_filter_once off;
        # 禁止缓存，确保每次都能拿到正确的主机名
        add_header Cache-Control "no-store";
        expires -1;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA fallback: any unknown path serves index.html for client-side routing
        try_files $uri $uri/ /index.html;
    }

    # NLS translation files must not be cached long-term so that locale
    # changes and image rebuilds are reflected immediately in the browser.
    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
