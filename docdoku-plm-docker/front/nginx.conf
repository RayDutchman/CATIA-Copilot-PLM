# ============================================================
# Payara 对比端口 :85 — 全部 API 转发到 back (Payara :8080)
# ============================================================
server {
    listen       85;
    server_name  localhost;

    charset utf-8;
    # 只列 nginx 默认不含的类型，避免 "duplicate MIME type text/html" warn
    charset_types text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量声明：避免 nginx 启动时 DNS 预解析（back 停用时不会导致启动失败）
    set $back   "back:8080";
    set $backpy "back-py:8000";

    # auth / parts：需暴露 jwt 响应头
    location ~ ^/docdoku-plm-server-rest/api/(auth/|files/[^/]+/(parts|part-templates)|workspaces/[^/]+/(parts|part-templates)) {
        proxy_pass         http://$back;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    # WebSocket 端点（统一转发到 back-py，与 :80 共享会话池）
    location /docdoku-plm-server-rest/ws {
        proxy_pass         http://$backpy/docdoku-plm-server-rest/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
    }

    # API 请求：全部转发到 back (Payara :8080)
    location /docdoku-plm-server-rest/ {
        proxy_pass         http://$back;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # webapp.properties.json：不再需要 sub_filter 注入 domain/port/ssl
    # 前端 contextResolver.js 直接从 window.location 读取这些值
    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.html$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}


# ============================================================
# 主端口 :80 — API 全部转发到 FastAPI back-py (:8000)
# ============================================================
server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 变量声明：运行时 DNS 解析，upstream 暂不可达时 nginx 仍能启动
    set $backpy "back-py:8000";

    # auth / parts：需暴露 jwt 响应头
    location ~ ^/docdoku-plm-server-rest/api/(auth/|files/[^/]+/(parts|part-templates)|workspaces/[^/]+/(parts|part-templates)) {
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    # WebSocket 端点
    location /docdoku-plm-server-rest/ws {
        proxy_pass         http://$backpy/docdoku-plm-server-rest/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 7200s;
    }

    # 所有其余 API — 全部转发到 FastAPI back-py
    location /docdoku-plm-server-rest/ {
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # webapp.properties.json：不再需要 sub_filter 注入 domain/port/ssl
    # 前端 contextResolver.js 直接从 window.location 读取这些值
    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.html$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
