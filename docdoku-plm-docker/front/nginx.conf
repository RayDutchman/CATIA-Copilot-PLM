server {
    listen       80;
    server_name  localhost;

    # Serve all text and JS files as UTF-8 so Chinese NLS translations
    # are decoded correctly by the browser and by RequireJS XHR requests.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    # -------------------------------------------------------------------------
    # 检测访问协议，用于动态注入 webapp.properties.json 的 port 和 ssl 字段。
    #
    # 判断依据：Host 头是否含端口号——这对任何反代工具都成立，无需依赖特定请求头：
    #   直接访问  http://localhost:8000        → Host: localhost:8000       → 含端口 → port=8000, ssl=false
    #   直接访问  http://192.168.100.140:8000  → Host: 192.168.100.140:8000 → 含端口 → port=8000, ssl=false
    #   经 Cloudflare https://plm.252327.xyz  → Host: plm.252327.xyz       → 无端口 → port=443,  ssl=true
    #   经 DDNSTO    https://cwbplm.ddnsto.com → Host: cwbplm.ddnsto.com   → 无端口 → port=443,  ssl=true
    #   未来任何反代（只要走标准 HTTPS）        → Host: 无端口               → 无端口 → port=443,  ssl=true
    #
    # 作为双重保险，同时检测 X-Forwarded-Proto（Cloudflare/nginx 等会注入）。
    # -------------------------------------------------------------------------
    set $plm_port 8000;
    set $plm_ssl  false;
    # 主判断：Host 不含端口 → 经反代的标准域名访问
    if ($http_host !~ ":\d+") {
        set $plm_port 443;
        set $plm_ssl  true;
    }
    # 双重保险：反代明确注入了 X-Forwarded-Proto: https
    if ($http_x_forwarded_proto = "https") {
        set $plm_port 443;
        set $plm_ssl  true;
    }

    # -------------------------------------------------------------------------
    # 反向代理后端 REST API（含 WebSocket）
    #
    # 作用：浏览器无论从哪个入口访问前端，所有 API 请求都通过同一主机的 8000 端口
    # 发出，由 nginx 内部转发给 back 容器，无需向外暴露 8001。
    # -------------------------------------------------------------------------
    location /docdoku-plm-server-rest/ {
        proxy_pass         http://back:8080/docdoku-plm-server-rest/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WebSocket 升级支持（PLM 实时推送）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 允许大文件上传（CAD 文件可能较大）
        client_max_body_size 500m;
    }

    # -------------------------------------------------------------------------
    # 动态注入 webapp.properties.json 中的 domain / port / ssl
    #
    # 三个字段全部根据实际访问入口动态替换，覆盖所有场景：
    #   局域网  http://192.168.100.140:8000  →  domain=192.168.100.140, port=8000, ssl=false
    #   本机    http://localhost:8000         →  domain=localhost,        port=8000, ssl=false
    #   公网    https://plm.252327.xyz        →  domain=plm.252327.xyz,  port=443,  ssl=true
    # -------------------------------------------------------------------------
    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        # 关闭 gzip 压缩，否则 sub_filter 无法替换压缩内容
        gzip off;
        # sub_filter 默认只处理 text/html，必须显式声明 json 类型
        sub_filter_types application/json text/plain;
        sub_filter '"domain": "localhost"'   '"domain": "$host"';
        sub_filter '"wsDomain": "localhost"' '"wsDomain": "$host"';
        sub_filter '"port": 8000'            '"port": $plm_port';
        sub_filter '"ssl": false'            '"ssl": $plm_ssl';
        sub_filter_once off;
        # 禁止缓存，确保每次都能拿到正确的值
        add_header Cache-Control "no-store";
        expires -1;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA fallback: any unknown path serves index.html for client-side routing
        try_files $uri $uri/ /index.html;
    }

    # NLS translation files must not be cached long-term so that locale
    # changes and image rebuilds are reflected immediately in the browser.
    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
