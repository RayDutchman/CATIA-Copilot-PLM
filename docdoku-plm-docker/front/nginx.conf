server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $plm_port 8000;
    set $plm_ssl  false;
    if ($http_host !~ ":\d+") {
        set $plm_port 443;
        set $plm_ssl  true;
    }
    if ($http_x_forwarded_proto = "https") {
        set $plm_port 443;
        set $plm_ssl  true;
    }

    # P0：认证端点已迁移到 FastAPI back-py
    location /docdoku-plm-server-rest/api/auth/ {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    location /docdoku-plm-server-rest/ {
        set $backend "back:8080";
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        gzip off;
        sub_filter_types application/json text/plain;
        sub_filter '"domain": "localhost"'   '"domain": "$host"';
        sub_filter '"wsDomain": "localhost"' '"wsDomain": "$host"';
        sub_filter '"port": 8000'            '"port": $plm_port';
        sub_filter '"ssl": false'            '"ssl": $plm_ssl';
        sub_filter_once off;
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.html$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
