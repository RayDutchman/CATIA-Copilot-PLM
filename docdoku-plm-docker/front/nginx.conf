server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $plm_port 8000;
    set $plm_ssl  false;
    if ($http_host !~ ":\d+") {
        set $plm_port 443;
        set $plm_ssl  true;
    }
    if ($http_x_forwarded_proto = "https") {
        set $plm_port 443;
        set $plm_ssl  true;
    }

    # P0：认证端点已迁移到 FastAPI back-py
    location /docdoku-plm-server-rest/api/auth/ {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    # P1a：零件端点迁移到 FastAPI back-py（正则只匹配 parts 路径）
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/parts {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
        add_header Access-Control-Expose-Headers "jwt" always;
    }

    # P1b：文件端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/files/[^/]+/parts {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P2：文档端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/documents {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P2：文件夹端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/folders {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # P2：文档模板端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/document-templates {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P2：文档文件端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/files/[^/]+/documents {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P3：产品结构端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/products {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # P3：产品文件端点
    location ~ ^/docdoku-plm-server-rest/api/files/[^/]+/products {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P4：变更管理端点迁移到 FastAPI back-py
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/changes {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    # P5：用户/组/成员资格/角色/工作流/通知/Webhook
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/(users|groups|memberships|roles|workflow-models|workflow-instances|workspace-workflows|tasks|notifications|webhooks|user-group) {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }

    # P5：WorkspaceResource 内散落的用户管理端点
    location ~ ^/docdoku-plm-server-rest/api/workspaces/[^/]+/(add-user|admin|user-access|group-access|remove-from-group|remove-from-workspace|enable-user|disable-user|enable-group|disable-group) {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # P5：账号管理
    location /docdoku-plm-server-rest/api/accounts {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # P5：工作区 CRUD（/workspaces + /workspaces/{ws}，仅匹配无子路径）
    location ~ ^/docdoku-plm-server-rest/api/workspaces(/[^/]+)?$ {
        set $backpy "back-py:8000";
        proxy_pass         http://$backpy;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /docdoku-plm-server-rest/ {
        set $backend "back:8080";
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500m;
    }

    location = /webapp.properties.json {
        root /usr/share/nginx/html;
        gzip off;
        sub_filter_types application/json text/plain;
        sub_filter '"domain": "localhost"'   '"domain": "$host"';
        sub_filter '"wsDomain": "localhost"' '"wsDomain": "$host"';
        sub_filter '"port": 8000'            '"port": $plm_port';
        sub_filter '"ssl": false'            '"ssl": $plm_ssl';
        sub_filter_once off;
        add_header Cache-Control "no-store";
        expires -1;
    }

    location ~* \.html$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
