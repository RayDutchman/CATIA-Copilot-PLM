server {
    listen       80;
    server_name  localhost;

    # Serve all text and JS files as UTF-8 so Chinese NLS translations
    # are decoded correctly by the browser and by RequireJS XHR requests.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    # ── 双轨并行路由分流 ──────────────────────────────────────────────────────
    #
    # 新轨道（Vite 构建）：
    #   /account-management-vue/  → Vue 3 SFC 版（阶段 3，测试中）
    #   /assets/                  → Vite 内容哈希资产（永久缓存）
    #
    # 旧轨道（Grunt 构建）：
    #   其余路径                  → 原 AMD/RequireJS 模块（/usr/share/nginx/html）
    # ─────────────────────────────────────────────────────────────────────────

    # Vite 内容哈希资产（文件名含 hash，永久缓存安全）
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue 3 SFC 版 account-management（新轨道，与旧版并存）
    # Vue 使用 hash 路由（createWebHashHistory），所有页面跳转在客户端完成，
    # 服务器只需将 /account-management-vue/ 目录的请求转到 index.html 即可。
    location /account-management-vue/ {
        root   /usr/share/nginx/html;
        index  index.html;
        # 不做 SPA fallback（hash 路由不需要），避免内部重定向循环
        try_files $uri $uri/ =404;
    }

    # Vue 3 SFC 版 workspace-management（阶段 4，新轨道）
    location /workspace-management-vue/ {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ =404;
    }

    # Vue 3 SFC 版 change-management（阶段 5，新轨道）
    location /change-management-vue/ {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ =404;
    }

    # Vue 3 SFC 版 document-management（阶段 6，新轨道）
    location /document-management-vue/ {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA fallback: any unknown path serves index.html for client-side routing
        try_files $uri $uri/ /index.html;
    }

    # NLS translation files must not be cached long-term so that locale
    # changes and image rebuilds are reflected immediately in the browser.
    location ~* /js/localization/nls/ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
