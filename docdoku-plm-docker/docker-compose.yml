networks:
  network:
    driver: bridge
    
volumes:
  # db 使用 named volume：PostgreSQL 对文件权限敏感，由 Docker 管理更安全。
  # 迁移方式：pg_dump / pg_restore，与存储位置无关。
  db-volume:
  es-volume:
  conversion-volume:
      
services:

  front:
    # 本地构建镜像，不可从 DockerHub 拉取（包含中文支持等本地修改）。
    # 构建方式：在 docdoku-plm-front/ 目录下执行 npm run build && docker build -f docker/Dockerfile -t docdoku/docdoku-plm-front:2.6.2 .
    image: docdoku/docdoku-plm-front:2.6.2
    restart: unless-stopped
    networks:
      - network
    ports:
      - 8000:80
      - 8005:85
    volumes:
      - ./env/front.json:/usr/share/nginx/html/webapp.properties.json
      # Custom nginx config that adds charset=utf-8 so Chinese NLS files are
      # decoded correctly by the browser and by RequireJS XHR requests.
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf

  back:
    # Payara 5 Java EE 后端 —— 已被 FastAPI back-py 完全替代，不再自动启动。
    # 保留配置仅供回滚参考；Port 8001 / Port 85（front nginx 对比端口）均停用。
    # 手动启动：docker compose start back
    image: docdoku/docdoku-plm-server:2.6.2
    restart: "no"
    env_file: ./env/back.env
    volumes:      
      - ./keystore:/opt/payara41/keystore
      - ./data/vault:/var/lib/docdoku/vault
      - conversion-volume:/var/lib/docdoku/conversions
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
      smtp:
        condition: service_started   
    networks:
      - network
    ports:
      - 8001:8080

  back-py:
    # FastAPI 后端（正式接管全部 REST 端点，Payara back 已停用）
    build:
      context: ../docdoku-plm-server-py
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./env/back-py.env
    volumes:
      - ./data/vault:/var/lib/docdoku/vault
      - conversion-volume:/var/lib/docdoku/conversions
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - network
    ports:
      - 8009:8000

  conversion:
    # Python-only 转换服务（2.7.0-py）：替代原 Java/Quarkus 编排层
    # 回滚方式：删除 build 块，将 image 改回 docdoku/docdoku-plm-conversion-service:2.6.2-jvm-hybrid-rollback
    build:
      context: ../conversion-service-py
      dockerfile: Dockerfile
    image: docdoku/docdoku-plm-conversion-service:2.7.0-py
    restart: unless-stopped
    env_file: ./env/conversion.env
    networks:
      - network
    volumes: 
      - ./data/vault:/data/vault
      - conversion-volume:/data/conversions
    depends_on: 
      kafka:
        condition: service_healthy

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.6.1
    restart: unless-stopped
    env_file: ./env/es.env
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - network    
    volumes:
      - es-volume:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  
  kibana:
     # Elasticsearch 可视化工具 —— 按需手动启动，不随 compose 自动启。
     # 手动启动：docker compose start kibana
     image: docker.elastic.co/kibana/kibana:6.6.1
     restart: "no"
     env_file: ./env/kibana.env      
     networks:
       - network
     depends_on:
       es:
         condition: service_healthy
     ports:
       - 8002:5601

  db:
    image: postgres:13.1-alpine
    restart: unless-stopped
    env_file: ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeit -d docdokuplm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s    

  smtp:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks:
      - network
    ports: 
      - 11025:1025
      - 8003:8025

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    networks:
      - network
    ports:
      - 8004:8080
    depends_on: 
      - db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    env_file: ./env/kafka.env    
    networks:
      - network
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 &>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  ssl-proxy:
    image: nginx:1.19.1-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/ssl:/etc/nginx/ssl
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 9000:443
    networks: 
      - network
    depends_on: 
      - front
